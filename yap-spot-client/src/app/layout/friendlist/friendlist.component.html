<div class="ml-1">
  <div class="flex flex-row justify-center mb-2 mt-2">
    <span>Friends List</span>
  </div>
  <hr class="border-t border-divider mx-2 mb-2" />
  <div class="relative mb-5 mt-3 px-1">
    <i class="absolute left-4 top-1/2 -translate-y-1/2 pi pi-search"></i>
    <input
      class="pl-9 bg-bg-main border border-border rounded-sm p-1 outline-none w-full"
      type="text"
      placeholder="Find a room..."
      (input)="findUser($event)"
    />
  </div>

  @if (foundUsers().length > 0) {
    @for (foundUser of foundUsers(); track foundUser.username) {
      <div class="flex flex-row items-center ml-3 cursor-pointer" (click)="goToDm(foundUser.username)">
        <button
          class="bg-[linear-gradient(to_bottom_right,#5f72f8,#39aff2)] border-0 rounded-full cursor-pointer mr-2 relative shrink-0"
        >
          <!-- {{user.username.substring(0,2)}} -->
          <img class="max-w-10 w-full rounded-full" [src]="foundUser.pfp" alt="" />
          <span
            class="absolute bottom-0 right-0 rounded-full w-3 h-3 border-2 border-border"
            [class.bg-online]="foundUser.status == 'online'"
            [class.bg-away]="foundUser.status == 'away'"
            [class.bg-offline]="foundUser.status == 'offline'"
          ></span>
        </button>
        <div class="flex flex-col flex-1">
          <span class="text-[#a0a8b8]">{{ foundUser.username }}</span>
          <p class="font-mono text-[#566962] text-xs">{{ foundUser.role }}</p>
        </div>
        <i class="pi pi-comment mr-5 shrink-0"></i>
      </div>
      <hr class="border-t border-divider mx-2 mt-3" />
    }
  } @else {
    <div class="justify-start flex flex-col gap-3 ml-3">
      <span>Users Online - {{ usersOnline() }}</span>
      <hr class="border-t border-divider" />
      @for (user of users; track user.username) {
        <div class="flex flex-row items-center cursor-pointer" (click)="goToDm(user.username)">
          <button
            class="bg-[linear-gradient(to_bottom_right,#5f72f8,#39aff2)] border-0 rounded-full cursor-pointer mr-2 relative shrink-0"
          >
            <!-- {{user.username.substring(0,2)}} -->
            <img class="max-w-10 w-full rounded-full" [src]="user.pfp" alt="" />
            <span
              class="absolute bottom-0 right-0 rounded-full w-3 h-3 border-2 border-border"
              [class.bg-online]="user.status == 'online'"
              [class.bg-away]="user.status == 'away'"
              [class.bg-offline]="user.status == 'offline'"
            ></span>
          </button>
          <div class="flex flex-col flex-1">
            <span class="text-[#a0a8b8]">{{ user.username }}</span>
            <p class="font-mono text-[#566962] text-xs">{{ user.role }}</p>
          </div>
          <i class="pi pi-comment mr-5 shrink-0"></i>
          <i class="pi pi-phone mr-5 shrink-0"></i>
        </div>
        <hr class="border-t border-divider mx-2 mb-2" />
      }
    </div>
  }
</div>
