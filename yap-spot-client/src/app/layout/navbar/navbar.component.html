<div class="flex flex-1 w-full h-full">
  <div class="flex flex-col h-full p-4 gap-2 border border-border rounded-l-md bg-bg-sidebar w-fit">
    <button
      (click)="selectFriends()"
      class="bg-[linear-gradient(to_bottom_right,#5f72f8,#39aff2)] p-3 rounded-lg flex items-center justify-center mb-5 cursor-pointer"
    >
      Y
    </button>

    <button
      (click)="selected.set(NavSection.Rooms)"
      class="relative bg-bg-elevated border border-border rounded-md flex justify-center p-4 transition-colors cursor-pointer"
      [class.bg-primary-600]="selected() === NavSection.Rooms"
    >
      @if (selected() === NavSection.Rooms) {
        <span
          class="absolute -left-4 top-1/2 -translate-y-1/2 w-[3px] h-[60%] bg-primary-500 rounded-r-full"
        ></span>
      }
      <i class="pi pi-comments"></i>
    </button>

    <button
      (click)="selected.set(NavSection.Servers)"
      class="relative bg-bg-elevated border border-border rounded-md flex justify-center p-4 transition-colors cursor-pointer"
      [class.bg-primary-600]="selected() === NavSection.Servers"
    >
      @if (selected() === NavSection.Servers) {
        <span
          class="absolute -left-4 top-1/2 -translate-y-1/2 w-[3px] h-[60%] bg-primary-500 rounded-r-full"
        ></span>
      }
      <i class="pi pi-server"></i>
    </button>

    <button
      class="bg-[linear-gradient(to_bottom_right,#5f72f8,#39aff2)] mt-auto border-0 rounded-full p-3 cursor-pointer"
    >
      MD
    </button>
  </div>

  @if (selected() === NavSection.Rooms) {
    <app-secondary-navbar />
  }
  @if (selected() === NavSection.Friends) {
    <div class="flex-1 h-full overflow-hidden">
      <router-outlet />
    </div>
  }
</div>
