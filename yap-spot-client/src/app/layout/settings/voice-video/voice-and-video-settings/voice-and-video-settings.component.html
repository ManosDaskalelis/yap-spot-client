<div class="flex flex-col gap-5 p-10 max-w-3xl mx-auto w-full">
  <span class="text-xl font-mono text-text-primary">Voice & Video</span>
  <div class="flex flex-col w-full rounded-lg border border-border bg-bg-card gap-2">
    <div class="flex items-start justify-between px-5 pb-5">
      <div class="flex flex-col gap-3 w-full">
        <div class="flex items-center mt-3 gap-1">
          <i class="pi pi-microphone"></i>
          <span class="">Input Device</span>
        </div>
        <div class="w-full">
          <select
            class="w-full bg-bg-elevated border border-border rounded-sm px-3 py-2 text-sm text-text-primary font-sans outline-none cursor-pointer hover:bg-bg-hover focus:border-primary-500 transition-colors"
            name=""
            id=""
          >
            @for (device of audioDevices; track device.deviceId) {
              <option class="bg-bg-elevated text-text-primary">{{ device.label }}</option>
            }
          </select>
        </div>
        <div class="flex flex-col gap-2 mt-2">
          <div class="flex text-sm text-text-secondary">
            <span>Input volume</span>
            <span class="ml-auto">{{ currentInputVol }}</span>
          </div>
          <input
            type="range"
            min="0"
            max="100"
            [(ngModel)]="currentInputVol"
            (input)="onVolumeChange()"
          />
        </div>
        <div class="flex flex-col gap-2 text-sm text-text-secondary">
          <span>Mic volume level test</span>
          <div class="w-full h-2 bg-bg-elevated rounded-full overflow-hidden border border-border">
            <div
              class="h-full bg-[linear-gradient(to_right,#5f72f8,#39aff2)] rounded-full transition-all duration-75"
              [style.width.%]="volume()"
            ></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
