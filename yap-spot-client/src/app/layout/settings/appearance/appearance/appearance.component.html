<div class="flex flex-col gap-5 p-10 max-w-2xl mx-auto">
  <span class="text-xl font-mono text-text-primary">Appearance</span>

  <div class="flex items-center justify-between p-4 rounded-lg border border-border bg-bg-card">
    <div class="flex flex-col gap-0.5">
      <span class="text-sm text-text-primary">Theme</span>
      <span class="text-xs text-text-secondary">{{ themeService.isLight() ? 'Light' : 'Dark' }}</span>
    </div>
    <button
      (click)="themeService.toggle()"
      class="flex items-center gap-4 border border-border rounded-sm px-3 py-1.5 text-sm text-text-primary hover:bg-bg-elevated transition-colors cursor-pointer"
    >
      <div class="relative w-4 h-4">
        <i class="pi pi-sun absolute transition-all duration-300"
           [class.opacity-0]="themeService.isLight()"
           [class.rotate-90]="themeService.isLight()"></i>
        <i class="pi pi-moon absolute transition-all duration-300"
           [class.opacity-0]="!themeService.isLight()"
           [class.rotate-90]="!themeService.isLight()"></i>
      </div>
      {{ themeService.isLight() ? 'Switch to Dark' : 'Switch to Light' }}
    </button>
  </div>
</div>
