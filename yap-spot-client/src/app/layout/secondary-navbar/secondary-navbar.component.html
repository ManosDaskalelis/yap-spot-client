<div class="flex flex-col w-fit h-full border-l-[#2a3345] p-4 gap-2 bg-bg-sidebar-infobar">
  <div class="flex flex-col gap-2 p-2">
    <span class="font-sans">yap-spot</span>
    <div class="flex bg-bg-hover p-3 items-center gap-2 border border-border rounded-sm">
      <i class="pi pi-search"></i>
      <input
        class="bg-[#30302e] border border-border rounded-sm p-2 outline-none"
        type="text"
        placeholder="Find a room..."
      />
    </div>
  </div>
  <hr class="border-t border-divider mx-2" />

  <div>user section</div>
  <div class="flex flex-col gap-3">
    @for (user of users; track user.username) {
      <div class="flex flex-row">
        <button
          class="bg-[linear-gradient(to_bottom_right,#5f72f8,#39aff2)] mt-auto border-0 rounded-full cursor-pointer mr-1 relative"
        >
          <!-- {{user.username.substring(0,2)}} -->
           <img class="max-w-10 w-full rounded-full" [src]="user.pfp" alt="">
          <span class="absolute bottom-0 right-0 rounded-full w-3 h-3 border-2 border-border" [class.bg-online]="user.status == 'online'" [class.bg-away]="user.status == 'away'" [class.bg-offline]="user.status == 'offline'"></span>
        </button>
        <div class="flex flex-col">
          <span class="text-[#a0a8b8]">{{ user.username }}</span>
          <p class="font-mono text-[#566962] text-xs">{{user.role}}</p>
        </div>
      </div>
    }
  </div>
</div>
