<div class="flex w-full h-screen bg-[#131420]">
  <div class="flex flex-col h-screen p-4 gap-2 bg-[#0c0e18] w-fit">
    <div class="flex justify-center p-2"><i class="pi pi-apple"></i></div>

    <button
      (click)="selected = 0"
      class="relative bg-[#1f243e] border border-[#1d1943] rounded-[10px] flex justify-center p-4 transition-colors"
      [class.bg-purple-700]="selected === 0"
    >
      @if (selected === 0) {
        <span class="absolute -left-4 top-1/2 -translate-y-1/2   w-[3px] h-[60%] bg-[#7c5af0] rounded-r-full"></span>
      }
      <i class="pi pi-users"></i>
    </button>

    <button
      (click)="selected = 1"
      class="relative bg-[#1f243e] border border-[#1d1943] rounded-[10px] flex justify-center p-4 transition-colors"
      [class.bg-purple-700]="selected === 1"
    >
      @if (selected === 1) {
        <span class="absolute -left-4 top-1/2 -translate-y-1/2 w-[3px] h-[60%] bg-[#7c5af0] rounded-r-full"></span>
      }
      <i class="pi pi-server"></i>
    </button>

    <button
      (click)="selected = 2"
      class="relative bg-[#1f243e] border border-[#1d1943] rounded-[10px] flex justify-center p-4 transition-colors"
      [class.bg-purple-700]="selected === 2"
    >
      @if (selected === 2) {
        <span class="absolute -left-4 top-1/2 -translate-y-1/2 w-[3px] h-[60%] bg-[#7c5af0] rounded-r-full"></span>
      }
      <i class="pi pi-server"></i>
    </button>
  </div>
</div>
